<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>T3O — Tâches du jour</title>
<style>
  :root {
    --bg: #f5f5f4; --card: #ffffff; --border: #e5e7eb;
    --text: #111827; --muted: #6b7280; --faint: #9ca3af;
    --green: #059669; --green-bg: #ecfdf5; --green-bd: #a7f3d0;
    --amber: #d97706; --amber-bg: #fffbeb; --amber-bd: #fde68a;
    --gray-act: #4b5563; --gray-bg: #f9fafb; --gray-bd: #e5e7eb;
    --dark: #111827;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  #pinGate { position: fixed; inset: 0; z-index: 99; background: #f5f5f4; display: flex; align-items: center; justify-content: center; }
  #pinGate .pinBox { width: 85%; max-width: 340px; text-align: center; }
  #pinGate h2 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
  #pinGate p { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
  #pinGate input { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; font-size: 18px; text-align: center; letter-spacing: .2em; margin-bottom: 10px; outline: none; }
  #pinGate input:focus { border-color: #111827; }
  #pinGate button { width: 100%; border: none; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 800; background: #111827; color: #fff; }
  #pinGate .err { color: #ef4444; font-size: 12px; margin-top: 8px; display: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 480px; margin: 0 auto; padding-bottom: 110px; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 18px 16px 12px; }
  .date { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
  h1 { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .counters { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .progress { height: 10px; border-radius: 999px; background: #eef0f1; overflow: hidden; }
  .progress > div { height: 100%; background: var(--green); border-radius: 999px; transition: width .4s; }
  .filters { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; border: none; border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 600; background: #f1f2f4; color: var(--muted); cursor: pointer; }
  .chip.active { background: var(--dark); color: #fff; }

  main { padding: 14px 16px 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: all .25s; }
  .card.fait { background: var(--green-bg); border-color: var(--green-bd); }
  .card.plusTard { background: var(--amber-bg); border-color: var(--amber-bd); }
  .card.nonPertinent { background: var(--gray-bg); opacity: .6; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .dot { width: 12px; height: 12px; border-radius: 999px; flex-shrink: 0; margin-top: 4px; }
  .dot.A { background: #ef4444; } .dot.B { background: #f59e0b; } .dot.C { background: #9ca3af; }
  .titre { font-weight: 600; line-height: 1.35; font-size: 15px; }
  .card.fait .titre, .card.nonPertinent .titre { text-decoration: line-through; color: var(--faint); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-size: 11px; border-radius: 999px; padding: 2px 8px; font-weight: 500; }
  .tag.dom { background: #eef2ff; color: #4338ca; }
  .tag.prio { background: #f1f2f4; color: var(--muted); }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn { border-radius: 12px; padding: 12px 4px; font-size: 13px; font-weight: 700; border: 1px solid; cursor: pointer; transition: transform .1s; }
  .btn:active { transform: scale(.95); }
  .btn.fait { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
  .btn.fait.on { background: var(--green); color: #fff; border-color: var(--green); }
  .btn.plusTard { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
  .btn.plusTard.on { background: var(--amber); color: #fff; border-color: var(--amber); }
  .btn.np { background: var(--gray-bg); color: var(--gray-act); border-color: var(--gray-bd); }
  .btn.np.on { background: var(--gray-act); color: #fff; border-color: var(--gray-act); }

  .section-btn { background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; margin: 14px 0 8px; cursor: pointer; padding: 0; }
  .empty { text-align: center; color: var(--faint); font-size: 14px; padding: 32px 0; }

  footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; }
  .footer-inner { max-width: 480px; margin: 0 auto; background: #fff; border-top: 1px solid var(--border); padding: 12px 16px; box-shadow: 0 -4px 12px rgba(0,0,0,.06); }
  .sync-msg { text-align: center; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .sync-msg.attente { color: var(--amber); } .sync-msg.ok { color: var(--faint); }
  #syncBtn { width: 100%; border: none; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 800; background: #f1f2f4; color: var(--faint); cursor: pointer; transition: transform .1s; }
  #syncBtn.actif { background: var(--dark); color: #fff; }
  #syncBtn:active { transform: scale(.97); }
</style>
</head>
<body>

<div id="pinGate">
  <div class="pinBox">
    <h2>T3O — Tâches du jour</h2>
    <p>Entrez votre code pour ouvrir l'appli.</p>
    <input type="password" id="pinInput" autocomplete="off" placeholder="•••">
    <button id="pinBtn">Ouvrir</button>
    <div class="err" id="pinErr">Code incorrect — réessayez.</div>
  </div>
</div>
<script>
(function () {
  var PIN = "T3O";
  var KEY = "t3o-pin-ok";
  var gate = document.getElementById("pinGate");
  var input = document.getElementById("pinInput");
  var btn = document.getElementById("pinBtn");
  var err = document.getElementById("pinErr");
  function ouvrir() {
    gate.style.display = "none";
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
  }
  var deja = false;
  try { deja = localStorage.getItem(KEY) === "1"; } catch (e) {}
  if (deja) { ouvrir(); } else {
    function verifier() {
      if (input.value.trim().toUpperCase() === PIN) { ouvrir(); }
      else { err.style.display = "block"; input.value = ""; input.focus(); }
    }
    btn.addEventListener("click", verifier);
    input.addEventListener("keydown", function (ev) { if (ev.key === "Enter") verifier(); });
  }
})();
</script>

<header>
  <div class="date">Mardi 10 novembre 2026</div>
  <h1>Tâches du jour</h1>
  <div class="counters"><span id="nbFaites"></span><span id="nbActives"></span></div>
  <div class="progress"><div id="barre"></div></div>
  <div class="filters" id="filtres"></div>
</header>

<main>
  <div id="listeActives"></div>
  <button class="section-btn" id="btnTraitees" style="display:none"></button>
  <div id="listeTraitees"></div>
  <div class="empty" id="vide" style="display:none">🎉 Journée terminée !</div>
</main>

<footer>
  <div class="footer-inner">
    <div class="sync-msg" id="syncMsg">Tout est synchronisé</div>
    <button id="syncBtn" disabled>📋 Copier la synthèse pour Vibe</button>
  </div>
</footer>

<script>
const TACHES = [
  { id: "4070c61f181a8128928ee011c5a60fbb", titre: "Vérifier le message Chorus Pro du 22/10 sur le portail", domaine: "Administration", priorite: "A", orig: { fait: false, plusTard: false, nonPertinent: false } },
  { id: "40c0c61f181a8133a9e1cfafcdd082fb", titre: "3 photos avant-pendant-après", domaine: "Communication et RP", priorite: "A", orig: { fait: false, plusTard: false, nonPertinent: false } },
  { id: "4080c61f181a81da9addf4f045939d24", titre: "Nettoyer compta perso/T3O", domaine: "Administration", priorite: "B", orig: { fait: false, plusTard: false, nonPertinent: false } },
  { id: "4070c61f181a8197bab8c0614b78daf4", titre: "Nettoyer le doublon CRM sur le Drive (garder l'exemplaire de DIFFUSION)", domaine: "Administration", priorite: "B", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "40f0c61f181a815d8f3bf6cca5acbf06", titre: "Facture L'Accolade", domaine: "Administration", priorite: "B", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "40c0c61f181a81fd8783e16c2cd2ce11", titre: "Liker 3 comptes", domaine: "Communication et RP", priorite: "B", orig: { fait: true, plusTard: false, nonPertinent: false } },
  { id: "4130c61f181a815394aff0ba979e6317", titre: "Redimensionner photos Instagram", domaine: "Communication et RP", priorite: "B", orig: { fait: false, plusTard: false, nonPertinent: false } },
  { id: "4140c61f181a81b9919cd2acc744e033", titre: "Chapeau Auterive : lieu", domaine: "Diffusion", priorite: "B", orig: { fait: true, plusTard: false, nonPertinent: false } },
  { id: "4140c61f181a8143bcd6cb19ee52d4a7", titre: "Vérifier envoi Chameau Malin", domaine: "Diffusion", priorite: "B", orig: { fait: true, plusTard: false, nonPertinent: false } },
  { id: "4140c61f181a8139b3a8cf8cc51295c9", titre: "En passant : @ttitude Albi", domaine: "Diffusion", priorite: "B", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "4140c61f181a816f800bd0b953507f4c", titre: "En passant : Clair-Obscur Albi", domaine: "Diffusion", priorite: "C", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "4140c61f181a8183aaeef95fbab2d85f", titre: "En passant à Albi : @ttitude + Clair-Obscur", domaine: "Diffusion", priorite: "B", orig: { fait: false, plusTard: false, nonPertinent: false } },
  { id: "4080c61f181a81ba9024fc2e2e3199fc", titre: "Dons : reçu papier après représentation", domaine: "Administration", priorite: "C", orig: { fait: false, plusTard: false, nonPertinent: false } },
  { id: "4100c61f181a81bc9b0bea7e0b609772", titre: "Archiver contrat n°43", domaine: "Administration", priorite: "C", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "4140c61f181a81e6b73dc3c1e66a9dfa", titre: "Évaluer : témoignages vidéo", domaine: "Strategie", priorite: "C", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "4140c61f181a810fbb41c555c16b45f5", titre: "Où vas-tu : 3 prochains jours ?", domaine: "Diffusion", priorite: "C", orig: { fait: true, plusTard: false, nonPertinent: false } },
  { id: "40c0c61f181a819fb556cac55a9cfeff", titre: "Sélectionner 3 belles photos", domaine: "Production", priorite: "C", orig: { fait: false, plusTard: false, nonPertinent: true } },
  { id: "40c0c61f181a81de9ff0d4d9513f6382", titre: "Alimenter CRM Personnes", domaine: "Communication et RP", priorite: "C", orig: { fait: false, plusTard: false, nonPertinent: false } },
];

const DOMAINES = ["Tous", "Administration", "Communication et RP", "Diffusion", "Production", "Strategie"];
const KEY = "t3o-taches-2026-11-10";
const ORDRE = { A: 0, B: 1, C: 2 };

let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { overrides = {}; }
let filtre = "Tous";
let afficherTraitees = true;

function etat(t) {
  const o = overrides[t.id];
  if (!o) return { ...t.orig, modifie: false };
  return { fait: !!o.fait, plusTard: !!o.plusTard, nonPertinent: !!o.nonPertinent, modifie: true };
}
function sauver() { try { localStorage.setItem(KEY, JSON.stringify(overrides)); } catch (e) {} }

function modifier(t, champ) {
  const e = etat(t);
  if (e[champ]) { delete overrides[t.id]; }
  else { overrides[t.id] = { fait: champ === "fait", plusTard: champ === "plusTard", nonPertinent: champ === "nonPertinent" }; }
  sauver(); rendre();
}

function carte(t) {
  const e = etat(t);
  const cls = e.fait ? "fait" : e.nonPertinent ? "nonPertinent" : e.plusTard ? "plusTard" : "";
  const div = document.createElement("div");
  div.className = "card " + cls;
  div.innerHTML =
    '<div class="row"><div class="dot ' + t.priorite + '"></div><div>' +
    '<p class="titre"></p>' +
    '<div class="tags"><span class="tag dom"></span><span class="tag prio">Priorité ' + t.priorite + '</span></div>' +
    '</div></div>' +
    '<div class="actions">' +
    '<button class="btn fait' + (e.fait ? " on" : "") + '" data-a="fait">✓ Fait</button>' +
    '<button class="btn plusTard' + (e.plusTard ? " on" : "") + '" data-a="plusTard">⏭ Plus tard</button>' +
    '<button class="btn np' + (e.nonPertinent ? " on" : "") + '" data-a="nonPertinent">✕ Non pertinent</button>' +
    '</div>';
  div.querySelector(".titre").textContent = t.titre;
  div.querySelector(".tag.dom").textContent = t.domaine;
  div.querySelectorAll(".btn").forEach(function (b) {
    b.addEventListener("click", function () { modifier(t, b.dataset.a); });
  });
  return div;
}

function rendre() {
  const listes = TACHES.map(function (t) { return Object.assign({}, t, { e: etat(t) }); });
  const actives = listes.filter(function (t) { return !t.e.fait && !t.e.nonPertinent; });
  const traitees = listes.filter(function (t) { return t.e.fait || t.e.nonPertinent; });
  const faites = listes.filter(function (t) { return t.e.fait; });
  const nbTotal = Math.max(1, listes.filter(function (t) { return !t.e.nonPertinent; }).length);
  const modifs = listes.filter(function (t) { return t.e.modifie; });

  document.getElementById("nbFaites").textContent = faites.length + " faite" + (faites.length > 1 ? "s" : "");
  document.getElementById("nbActives").textContent = actives.length + " à faire · " + listes.filter(function (t) { return t.e.plusTard; }).length + " reportée(s)";
  document.getElementById("barre").style.width = Math.min(100, Math.round(faites.length / nbTotal * 100)) + "%";

  const fa = function (l) { return filtre === "Tous" ? true : l.domaine === filtre; };
  const la = document.getElementById("listeActives");
  la.innerHTML = "";
  actives.filter(fa).sort(function (a, b) { return ORDRE[a.priorite] - ORDRE[b.priorite]; }).forEach(function (t) { la.appendChild(carte(t)); });

  const lt = document.getElementById("listeTraitees");
  const bt = document.getElementById("btnTraitees");
  lt.innerHTML = "";
  if (afficherTraitees) {
    traitees.filter(fa).forEach(function (t) { lt.appendChild(carte(t)); });
    bt.style.display = traitees.length ? "block" : "none";
    bt.textContent = "▾ Traitées (" + traitees.length + ") — masquer";
  } else {
    bt.style.display = traitees.length ? "block" : "none";
    bt.textContent = "▸ Afficher les traitées (" + traitees.length + ")";
  }

  document.getElementById("vide").style.display = actives.length === 0 ? "block" : "none";

  const msg = document.getElementById("syncMsg");
  const btn = document.getElementById("syncBtn");
  if (modifs.length) {
    msg.textContent = modifs.length + " changement" + (modifs.length > 1 ? "s" : "") + " à synchroniser";
    msg.className = "sync-msg attente";
    btn.disabled = false; btn.className = "actif";
    btn.textContent = "📋 Copier la synthèse pour Vibe";
  } else {
    msg.textContent = "Tout est synchronisé";
    msg.className = "sync-msg ok";
    btn.disabled = true; btn.className = "";
  }
}

document.getElementById("btnTraitees").addEventListener("click", function () { afficherTraitees = !afficherTraitees; rendre(); });

var filtresDiv = document.getElementById("filtres");
DOMAINES.forEach(function (d) {
  var b = document.createElement("button");
  b.className = "chip" + (d === "Tous" ? " active" : "");
  b.textContent = d;
  b.addEventListener("click", function () {
    filtre = d;
    filtresDiv.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
    b.classList.add("active");
    rendre();
  });
  filtresDiv.appendChild(b);
});

document.getElementById("syncBtn").addEventListener("click", function () {
  var lignes = [];
  var faites = TACHES.filter(function (t) { return etat(t).fait; });
  var plusTard = TACHES.filter(function (t) { return etat(t).plusTard; });
  var np = TACHES.filter(function (t) { return etat(t).nonPertinent; });
  if (faites.length) lignes.push("✅ Marquer « Fait » : " + faites.map(function (t) { return t.titre; }).join(" ; "));
  if (plusTard.length) lignes.push("⏭️ À reporter : " + plusTard.map(function (t) { return t.titre; }).join(" ; "));
  if (np.length) lignes.push("🚫 Marquer « Non pertinent » : " + np.map(function (t) { return t.titre; }).join(" ; "));
  var txt = "Mets à jour mes tâches du jour dans Notion (base « T3O — Tâches du jour », 2026-11-10).\n" + (lignes.length ? lignes.join("\n") : "Aucun changement.");
  var done = function () {
    var btn = document.getElementById("syncBtn");
    btn.textContent = "✓ Copié — colle-le dans le chat Vibe";
    btn.disabled = false; btn.className = "actif";
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function () { prompt(txt); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { prompt(txt); }
    document.body.removeChild(ta);
  }
});

rendre();
</script>
</body>
</html>
